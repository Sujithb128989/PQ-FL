name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Run End-to-End Smoke Verification
      run: |
        chmod +x ./scripts/run_smoke_verification.sh
        ./scripts/run_smoke_verification.sh
