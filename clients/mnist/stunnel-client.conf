; PQ-FL stunnel client configuration
; Terminates OQS Dilithium5 mTLS on behalf of the Python gRPC client.
;
; The Python client connects to 127.0.0.1:50052 (plaintext) and stunnel
; forwards to pqfl-server:50051 using OQS-OpenSSL with Dilithium5 certs.

pid = /tmp/stunnel.pid
foreground = quiet
; Use OQS-OpenSSL engine
; (stunnel is compiled against /opt/openssl which includes liboqs)

[pqfl]
client = yes
accept = 127.0.0.1:50052
connect = pqfl-server:50051

; mTLS: present Dilithium5 client certificate
cert = /app/certs/client.crt
key = /app/certs/client.key

; Verify server certificate against the PQ-FL CA
CAfile = /app/certs/ca.crt
verifyChain = yes

; Disable SSLv3/TLSv1.0/1.1 — require TLS 1.2+ (OQS-OpenSSL 1.1.1 max)
sslVersion = TLSv1.2

; Logging
debug = info
